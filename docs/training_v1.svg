<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="404" viewBox="0 0 460 202" role="img" aria-label="Two-tower training: a triplet is embedded with frozen GloVe, encoded by two towers, and scored by triplet loss">
  <style>
    /* Palette and weights follow alphaedit-chart-style-guide.md (BBK report diagrams).
       Colours are literal here so the file renders standalone. */
    .tk  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 7px;   fill: #161C22; }
    .tw  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 7px;   fill: #FFFFFF; }
    .twb { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 7px;   font-weight: 600; fill: #FFFFFF; }
    .tm  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 6.2px; fill: #97A5B3; }
    .tl  { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 6.4px; letter-spacing: .08em; fill: #97A5B3; }
    .box  { fill: #FFFFFF; stroke: #3B4652; stroke-width: 1; }
    .pos  { fill: #AFEAFC; stroke: #3B4652; stroke-width: 1; }
    .neg  { fill: #F0FBC3; stroke: #3B4652; stroke-width: 1; }
    .acc  { fill: #645AC6; stroke: #3B4652; stroke-width: 1; }
    .boxd { fill: none; stroke: #97A5B3; stroke-width: 1; stroke-dasharray: 3 2.5; }
    .conn { fill: none; stroke: #97A5B3; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0.6 L8 4 L0 7.4 Z" fill="#97A5B3"/>
    </marker>
  </defs>
  <rect width="460" height="202" fill="#FFFFFF"/>

  <!-- column labels -->
  <text class="tl" x="10"  y="18">TRIPLET</text>
  <text class="tl" x="118" y="18">EMBED</text>
  <text class="tl" x="240" y="18">ENCODE</text>
  <text class="tl" x="340" y="18">SCORE</text>

  <!-- 1 · triplet -->
  <rect class="box" x="10" y="30"  width="86" height="22" rx="3"/>
  <text class="tk" x="16" y="40">query</text>
  <text class="tm" x="16" y="48">q</text>
  <rect class="pos" x="10" y="80"  width="86" height="22" rx="3"/>
  <text class="tk" x="16" y="90">relevant passage</text>
  <text class="tm" x="16" y="98">p+ from MS MARCO</text>
  <rect class="neg" x="10" y="130" width="86" height="22" rx="3"/>
  <text class="tk" x="16" y="140">random passage</text>
  <text class="tm" x="16" y="148">p− negative sample</text>

  <line class="conn" x1="96" y1="41"  x2="114" y2="41"  marker-end="url(#arw)"/>
  <line class="conn" x1="96" y1="91"  x2="114" y2="91"  marker-end="url(#arw)"/>
  <line class="conn" x1="96" y1="141" x2="114" y2="141" marker-end="url(#arw)"/>

  <!-- 2 · frozen GloVe, mean pooled -->
  <rect class="boxd" x="118" y="26" width="88" height="130" rx="5"/>
  <text class="tk" x="126" y="72">GloVe 6B</text>
  <text class="tk" x="126" y="81">100-d, frozen</text>
  <text class="tm" x="126" y="96">tokenise,</text>
  <text class="tm" x="126" y="104">look up each word,</text>
  <text class="tm" x="126" y="112">average</text>
  <text class="tm" x="126" y="128">→ one 100-d vector</text>

  <line class="conn" x1="206" y1="41"  x2="236" y2="41"  marker-end="url(#arw)"/>
  <line class="conn" x1="206" y1="91"  x2="236" y2="91"  marker-end="url(#arw)"/>
  <line class="conn" x1="206" y1="141" x2="236" y2="141" marker-end="url(#arw)"/>

  <!-- 3 · towers -->
  <rect class="box" x="240" y="30" width="84" height="22" rx="3"/>
  <text class="tk" x="246" y="40">query tower</text>
  <text class="tm" x="246" y="48">Linear·ReLU·Linear</text>
  <rect class="box" x="240" y="80" width="84" height="72" rx="3"/>
  <text class="tk" x="246" y="90">document tower</text>
  <text class="tm" x="246" y="98">Linear·ReLU·Linear</text>
  <text class="tm" x="246" y="116">same weights for</text>
  <text class="tm" x="246" y="124">p+ and p−</text>

  <line class="conn" x1="324" y1="41"  x2="338" y2="72"  marker-end="url(#arw)"/>
  <line class="conn" x1="324" y1="91"  x2="338" y2="91"  marker-end="url(#arw)"/>
  <line class="conn" x1="324" y1="141" x2="338" y2="110" marker-end="url(#arw)"/>

  <!-- 4 · loss -->
  <rect class="acc" x="342" y="62" width="108" height="58" rx="3"/>
  <text class="twb" x="348" y="75">triplet loss</text>
  <text class="tw"  x="348" y="89">max(0, d(q,p+)</text>
  <text class="tw"  x="348" y="98">   − d(q,p−) + 0.7)</text>
  <text class="tw"  x="348" y="112">d = 1 − cos</text>

  <!-- footnote -->
  <text class="tm" x="10" y="178">Only the two towers train: 40,400 parameters. Adam, lr 0.002, batch 256, 20 epochs.</text>
  <text class="tm" x="10" y="188">Loss is zero once p+ is closer to q than p− by at least the margin.</text>
</svg>
